<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trend spike</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>html,body,#map{height:100%;margin:0}#log{position:absolute;z-index:1000;bottom:0;left:0;background:#000c;color:#0f0;font:12px monospace;padding:6px;max-width:70%}</style>
</head>
<body>
<div id="map"></div><div id="log">loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R = window.__results = {};
const q = new URLSearchParams(location.search);
const box = (q.get('box') || '35,45,-100,-90').split(',').map(Number); // latMin,latMax,lonMin,lonMax
const param = q.get('p') || 'GWETROOT';
const y0 = 1981, y1 = 2024;
function mannKendall(x) {
  const n = x.length; let s = 0; const slopes = [];
  for (let i = 0; i < n - 1; i++) for (let j = i + 1; j < n; j++) {
    s += Math.sign(x[j] - x[i]); slopes.push((x[j] - x[i]) / (j - i));
  }
  const v = n * (n - 1) * (2 * n + 5) / 18;
  const z = s > 0 ? (s - 1) / Math.sqrt(v) : s < 0 ? (s + 1) / Math.sqrt(v) : 0;
  const p = erfc(Math.abs(z) / Math.SQRT2);
  slopes.sort((a, b) => a - b);
  const m = slopes.length, sen = m % 2 ? slopes[(m - 1) / 2] : (slopes[m / 2 - 1] + slopes[m / 2]) / 2;
  return {z, p, sen};
}
function erfc(x) { // Numerical Recipes approximation, |error| < 1.2e-7
  const t = 1 / (1 + 0.5 * x);
  return t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 + t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
}
const map = L.map('map').fitBounds([[box[0], box[2]], [box[1], box[3]]]);
L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg', {maxNativeZoom: 8}).addTo(map);
(async () => {
  const url = `https://power.larc.nasa.gov/api/temporal/monthly/regional?parameters=${param}&community=AG&latitude-min=${box[0]}&latitude-max=${box[1]}&longitude-min=${box[2]}&longitude-max=${box[3]}&start=${y0}&end=${y1 + 1}&format=JSON`;
  const t0 = performance.now();
  const r = await fetch(url); const d = await r.json();
  R.fetchMs = Math.round(performance.now() - t0); R.status = r.status;
  const t1 = performance.now(); const counts = {up: 0, down: 0, ns: 0};
  for (const f of d.features) {
    const v = f.properties.parameter[param]; const ann = [];
    for (let y = y0; y <= y1; y++) { let s = 0; for (let m = 1; m <= 12; m++) s += v[`${y}${String(m).padStart(2, '0')}`]; ann.push(s / 12); }
    const t = mannKendall(ann);
    const cls = t.p < 0.05 ? (t.sen > 0 ? 'up' : 'down') : 'ns'; counts[cls]++;
    const [lon, lat] = f.geometry.coordinates;
    L.rectangle([[lat - 0.25, lon - 0.3125], [lat + 0.25, lon + 0.3125]], {weight: 0, fillOpacity: cls === 'ns' ? 0.05 : 0.55, fillColor: cls === 'up' ? '#2b83ba' : cls === 'down' ? '#d7191c' : '#999'})
      .bindTooltip(`${param} ${y0}-${y1}: Sen slope ${t.sen.toExponential(2)}/yr, p=${t.p.toFixed(3)}`).addTo(map);
  }
  R.computeMs = Math.round(performance.now() - t1); R.cells = d.features.length; R.counts = counts; R.param = param; R.box = box; R.done = true;
  document.getElementById('log').textContent = JSON.stringify(R);
})().catch(e => { R.error = e.message; R.done = true; document.getElementById('log').textContent = 'ERR ' + e.message; });
</script>
</body>
</html>
